<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clocktower Solo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #f4f1ea; --panel: #fffdf8; --ink: #22201c; --muted: #6b665c; --line: #ddd6c8;
    --accent: #7a2331; --accent-ink: #fff; --gold: #b8860b; --good: #2f5d8a; --evil: #a3202f;
    --sel: #2f7d4f; --private-bg: #fbf3d9; --dead: #9a958b; --bubble: #ffffff; --night: #1b2240;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161c; --panel: #1d2028; --ink: #e8e4da; --muted: #a29d92; --line: #343846;
      --accent: #c2485b; --accent-ink: #fff; --gold: #d9a632; --good: #6ea3d8; --evil: #e06272;
      --sel: #4fb47a; --private-bg: #2f2a1c; --dead: #6c6a66; --bubble: #2a2e3a; --night: #0b0e1a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161c; --panel: #1d2028; --ink: #e8e4da; --muted: #a29d92; --line: #343846;
      --accent: #c2485b; --accent-ink: #fff; --gold: #d9a632; --good: #6ea3d8; --evil: #e06272;
      --sel: #4fb47a; --private-bg: #2f2a1c; --dead: #6c6a66; --bubble: #2a2e3a; --night: #0b0e1a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; transition: background .8s; }
  body.night { background: color-mix(in srgb, var(--night) 55%, var(--bg)); }
  header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  .chip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
  .chip.good { border-color: var(--good); color: var(--good); }
  .chip.evil { border-color: var(--evil); color: var(--evil); }
  .spacer { flex: 1; }
  button, select { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 10px; }
  .seg button.on { background: var(--ink); color: var(--panel); }
  main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1420px; margin: 0 auto; }
  main > * { min-width: 0; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; padding-block: 12px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }

  /* table */
  #tableWrap { position: relative; }
  #table { position: relative; width: 100%; max-width: 640px; aspect-ratio: 1; margin: 0 auto; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--panel) 92%, var(--gold)) 0%, var(--panel) 70%); border: 1px solid var(--line); }
  #center { position: absolute; inset: 33%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 50%; border: 1px dashed var(--line); padding: 6px; }
  #center .big { font-size: 22px; font-weight: 700; }
  #center .small { color: var(--muted); font-size: 13px; }
  .seat { position: absolute; width: 104px; margin: -42px 0 0 -52px; text-align: center; user-select: none; cursor: pointer; }
  .token { width: 58px; height: 58px; margin: 0 auto 3px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; transition: transform .15s, box-shadow .15s; }
  .seat.you .token { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 30%, transparent); }
  .seat.mate .token { border-color: var(--evil); }
  .seat.dead .token { background: transparent; color: var(--dead); border-style: dashed; }
  .seat.dead .name { color: var(--dead); text-decoration: line-through; }
  .seat.speaking .token { transform: scale(1.12); box-shadow: 0 0 0 6px color-mix(in srgb, var(--gold) 45%, transparent); }
  .seat .name { font-size: 13px; font-weight: 600; }
  .seat .claim { font-size: 12px; color: var(--muted); line-height: 1.25; }
  .seat .ghost { font-size: 11px; color: var(--muted); font-style: italic; }
  .seat .role { font-size: 11px; font-weight: 700; }
  .seat .role.good { color: var(--good); } .seat .role.evil { color: var(--evil); }
  .seat.pickable .token { border-color: var(--sel); animation: pulse 1.4s infinite; }
  .seat.picked .token { background: var(--sel); color: #fff; border-color: var(--sel); animation: none; }
  .seat.pickable:hover .token { transform: scale(1.08); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--sel) 25%, transparent); } }
  .bubble { position: absolute; z-index: 3; max-width: 230px; background: var(--bubble); border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; font-size: 13px; line-height: 1.35; box-shadow: 0 4px 14px rgba(0,0,0,.12); pointer-events: none; }
  .bubble.chat { border-color: var(--good); }
  .bubble.new { animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  #banner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 4; }
  #banner div { background: color-mix(in srgb, var(--night) 88%, transparent); color: #f2e9d0; font-size: 30px; font-weight: 700; padding: 18px 36px; border-radius: 14px; letter-spacing: 1px; opacity: 0; transition: opacity .6s; }
  #banner.show div { opacity: 1; }

  /* moments: event cards, the ticker, line tags */
  #card { position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center; padding: 16px;
          padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
          background: color-mix(in srgb, var(--night) 45%, transparent); }
  #card .box { width: min(460px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px 22px 18px;
               box-shadow: 0 18px 50px rgba(0,0,0,.25); text-align: center; animation: rise .3s ease-out; }
  #card.night .box { background: var(--night); color: #f2e9d0; border-color: color-mix(in srgb, var(--night) 70%, #fff); }
  #card h2 { margin: 0 0 8px; font-size: 26px; letter-spacing: .5px; text-wrap: balance; }
  #card p { margin: 0 0 16px; font-size: 16px; line-height: 1.6; }
  #card .bar { height: 3px; background: color-mix(in srgb, var(--muted) 30%, transparent); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  #card .bar div { height: 100%; width: 100%; background: var(--gold); transform-origin: left; }
  #card button { min-width: 140px; min-height: 44px; }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } }
  #ticker { min-height: 0; margin: 0 auto 10px; max-width: 640px; text-align: center; font-weight: 650; padding: 8px 12px; border-radius: 10px;
            background: color-mix(in srgb, var(--accent) 10%, var(--panel)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .tag2 { display: inline-block; font-size: 11px; font-weight: 650; padding: 0 6px; border-radius: 6px; margin-right: 6px; vertical-align: 1px;
          border: 1px solid var(--line); color: var(--muted); }
  .tag2.info { color: var(--good); border-color: var(--good); }
  .tag2.claim { color: var(--gold); border-color: var(--gold); }
  .tag2.suspect { color: var(--evil); border-color: var(--evil); }
  .line.info-line { background: color-mix(in srgb, var(--good) 7%, transparent); border-radius: 4px; padding: 4px 6px; }

  /* prompt */
  #prompt { margin-top: 14px; min-height: 96px; }
  #prompt .q { font-weight: 650; margin-bottom: 10px; }
  #prompt .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  #prompt .hint { color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
  .waiting { color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .dots span { display: inline-block; width: 7px; height: 7px; margin-right: 3px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 50% { opacity: .2; } }
  .banner-end { font-size: 20px; font-weight: 700; margin-bottom: 8px; }

  /* side */
  #roleCard { margin-bottom: 12px; border-left: 4px solid var(--good); }
  #roleCard.evil { border-left-color: var(--evil); }
  #roleCard .rname { font-size: 18px; font-weight: 700; }
  #roleCard .rkind { color: var(--muted); font-size: 13px; margin-left: 6px; }
  #roleCard .rtext { margin-top: 4px; font-size: 14px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  #side .pane { height: calc(100vh - 300px); min-height: 340px; overflow-y: auto; padding-right: 6px; }
  @media (max-width: 960px) { #side .pane { height: 60vh; } }
  .line { padding: 3px 0; }
  .line.day { margin-top: 14px; font-weight: 700; font-size: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
  .line.sys { color: var(--muted); font-style: italic; }
  .line.say b { margin-right: 4px; }
  .line.private { background: var(--private-bg); border-left: 3px solid var(--gold); padding: 5px 8px; margin: 4px 0; border-radius: 4px; }
  .line.private .tag { font-weight: 650; color: var(--gold); margin-right: 4px; }
  .line.chat { background: color-mix(in srgb, var(--good) 10%, transparent); border-left: 3px solid var(--good); padding: 5px 8px; margin: 4px 0; border-radius: 4px; }
  .line.chat .tag { font-weight: 650; color: var(--good); margin-right: 4px; }
  .line.result { font-weight: 650; }
  pre { white-space: pre-wrap; font: 13px/1.55 ui-monospace, Menlo, Consolas, "PingFang SC", monospace; margin: 0; }
  .role-ref { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .role-ref .n { font-weight: 650; }
  .role-ref .k { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .role-ref.mine { background: color-mix(in srgb, var(--gold) 12%, transparent); }
  .role-ref .who { font-size: 12px; color: var(--accent); margin-left: 6px; }
  .role-ref p { margin: 2px 0 0; font-size: 14px; }
  h4 { margin: 14px 0 4px; }

  /* modal */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  #modal[hidden], [hidden] { display: none !important; }
  #modal .card { max-width: 480px; width: 100%; max-height: 80vh; overflow-y: auto; }
  #modal h3 { margin: 0 0 4px; }

  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 30; background: color-mix(in srgb, var(--bg) 85%, transparent); padding: 16px; }
  #loading .card { display: flex; gap: 10px; align-items: center; }

  /* phones */
  @media (max-width: 640px) {
    body { font-size: 14px; }
    header { padding-block: 8px; gap: 6px; }
    header h1 { font-size: 15px; width: 100%; }
    #seed { display: none; }
    main { padding-block: 10px 0; gap: 10px; }
    .card { padding: 10px; }
    .seat { width: 72px; margin: -30px 0 0 -36px; }
    .token { width: 40px; height: 40px; font-size: 13px; border-width: 2px; }
    .seat .name { font-size: 11px; }
    .seat .claim, .seat .ghost, .seat .role { font-size: 10px; }
    #center { inset: 30%; }
    #center .big { font-size: 16px; }
    #center .small { font-size: 11px; }
    .bubble { max-width: 150px; font-size: 12px; padding: 5px 8px; }
    #banner div { font-size: 22px; padding: 12px 22px; }
    #prompt { position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 6; margin-top: 10px; max-height: 48vh; overflow-y: auto;
              box-shadow: 0 -6px 18px rgba(0,0,0,.12); border-radius: 14px 14px 0 0; }
    #prompt button { min-height: 42px; }
    #side .pane { height: 55vh; min-height: 0; }
    #roleCard .rname { font-size: 16px; }
    #roleCard .rtext { font-size: 13px; }
    #start { margin: 16px max(16px, env(safe-area-inset-left, 0px)); }
    #start .row { grid-template-columns: 1fr; gap: 0; }
  }

  /* start */
  #start { max-width: 580px; margin: 40px auto; }
  #start label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
  #start input, #start select { width: 100%; padding: 8px 10px; background: var(--bg); color: var(--ink); font: inherit; border: 1px solid var(--line); border-radius: 8px; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  #start .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #start .check { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-weight: 400; }
  #start .check input { width: auto; }
  #start p { color: var(--muted); font-size: 14px; }
  .err { color: var(--evil); font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1 data-i="title"></h1>
  <span id="you" class="chip" hidden></span>
  <span id="seed" class="chip" hidden></span>
  <span class="spacer"></span>
  <label id="speedBox" hidden><span data-i="speed"></span>
    <select id="speed">
      <option value="step" data-i="step"></option><option value="slow" data-i="slow"></option>
      <option value="normal" data-i="normal"></option><option value="fast" data-i="fast"></option>
    </select></label>
  <span class="seg" id="langSeg"><button data-lang="en">EN</button><button data-lang="zh">中文</button></span>
  <button id="newBtn" hidden data-i="newGame"></button>
</header>

<section id="start" class="card" hidden>
  <h2 style="margin-top:0" data-i="startTitle"></h2>
  <p data-i="startIntro"></p>
  <label for="name" data-i="yourName"></label>
  <input id="name" maxlength="20" autocomplete="off">
  <div class="row">
    <div><label for="players" data-i="players"></label><select id="players"></select></div>
    <div><label for="seat" data-i="yourSeat"></label><select id="seat"></select></div>
  </div>
  <label for="side" data-i="side"></label>
  <select id="side"><option value="" data-i="sideAny"></option><option value="good" data-i="sideGood"></option><option value="evil" data-i="sideEvil"></option></select>
  <label for="seedIn" data-i="gameNo"></label>
  <input id="seedIn" inputmode="numeric">
  <label class="check"><input type="checkbox" id="hints"> <span data-i="hints"></span></label>
  <div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap">
    <button class="primary" id="startBtn" data-i="takeSeat"></button>
    <button id="backBtn" hidden data-i="back"></button>
  </div>
  <div class="err" id="startErr"></div>
</section>

<main id="game" hidden>
  <div id="tableWrap">
    <div id="ticker" hidden></div>
    <div id="table"><div id="center"></div></div>
    <div id="banner"><div></div></div>
    <div id="prompt" class="card"></div>
  </div>
  <div>
    <div id="roleCard" class="card"></div>
    <div id="side" class="card">
      <div class="tabs">
        <button data-tab="story" class="on" data-i="story"></button>
        <button data-tab="notes" data-i="notebook"></button>
        <button data-tab="mine" data-i="onlyYou"></button>
        <button data-tab="chars" data-i="characters"></button>
      </div>
      <div class="pane" id="pane-story"></div>
      <div class="pane" id="pane-notes" hidden><pre id="notes"></pre></div>
      <div class="pane" id="pane-mine" hidden></div>
      <div class="pane" id="pane-chars" hidden></div>
    </div>
  </div>
</main>
<div id="modal" hidden></div>
<div id="card" hidden><div class="box"><h2 id="cardTitle"></h2><p id="cardText"></p><div class="bar"><div id="cardBar"></div></div>
  <button class="primary" id="cardBtn"></button></div></div>
<div id="loading" hidden><div class="card"><span class="dots"><span></span><span></span><span></span></span>
  <span data-i="loading"></span></div></div>

<script>
const UI = {
  en: {
    title: "Clocktower Solo", speed: "Speed ", step: "Step by step", slow: "Slow", normal: "Normal", fast: "Fast",
    cont: "Continue", nextLine: "Continue ▶", tags: { claim: "claim", claim_change: "new claim", report: "info", suspect: "suspicion", suspect_plain: "suspicion", reply: "defence", defend: "defence", defend_silent: "defence", reply_silent: "defence" },
    newGame: "New game", startTitle: "Trouble Brewing, solo",
    startIntro: "You take one seat; everyone else is an AI player. Each day: introductions, private chats, open discussion, then nominations and votes. Anyone may bluff, even about being evil, but changing your claim in public costs trust. Everything said is kept in your notebook.",
    yourName: "Your name", players: "Players", yourSeat: "Your seat", side: "Play as",
    sideAny: "Either side (random)", sideGood: "Good", sideEvil: "Evil", gameNo: "Game number (optional, to replay)",
    hints: "Show me hints (a veteran's read of the suspects)", takeSeat: "Take your seat", back: "Back to the current game",
    story: "Story", notebook: "Notebook", onlyYou: "Only you", characters: "Characters",
    random: "Random", seatN: "Seat {n}", playersN: "{n} players", recommended: " (recommended)", slowN: " (slow)",

    pass: "Pass", yes: "Yes, raise my hand", no: "No", confirm: "Confirm", useDefault: "Use {names}",
    chosen: "Chosen: {names}.", none: "none yet", pickN: "Click {k} players at the table.",
    good: "Good", evil: "Evil", yourChar: "Your character", claimedBy: "claimed by {names}",
    over: "{team} wins.", overNoOne: "The game ran out of days.", overHint: "Everyone's true character is now shown at the table. The Story tab has the full Grimoire and the Storyteller's notes.",
    playAgain: "Play again", close: "Close", history: "What they've said and done", nothing: "Nothing yet.",
    dead: "dead", phases: { setup: "Setting up", night: "Night", dawn: "Dawn", introductions: "Introductions", "private chats": "Private chats", discussion: "Discussion", nominations: "Nominations", over: "Game over" },
    dayN: "Day {n}", nightN: "Night {n}", wrong: "Something went wrong:",

  zh: {

    cont: "继续", nextLine: "继续 ▶", tags: { claim: "报身份", claim_change: "改口", report: "报信息", suspect: "怀疑", suspect_plain: "怀疑", reply: "辩解", defend: "辩解", defend_silent: "辩解", reply_silent: "辩解" },
    newGame: "新游戏", startTitle: "暗流涌动 · 单人游戏",
    startIntro: "你占一个座位，其他玩家都由AI扮演。每天依次是：自我介绍、私聊、公开讨论、提名和投票。任何人都可以伪装，甚至伪装成邪恶角色；但公开改口会让人不信任你。所有发言都会记在你的笔记里。",
    yourName: "你的名字", players: "玩家人数", yourSeat: "你的座位", side: "你想玩",
    sideAny: "随机阵营", sideGood: "善良", sideEvil: "邪恶", gameNo: "局号（可选，用于重玩）",
    hints: "给我提示（老手对嫌疑人的判断）", takeSeat: "入座", back: "回到当前游戏",
    story: "故事", notebook: "笔记", onlyYou: "仅你可见", characters: "角色",
    random: "随机", seatN: "{n}号座位", playersN: "{n}名玩家", recommended: "（推荐）", slowN: "（较慢）",
    you: "你：{name}，{role}", game: "第{n}局", thinking: "其他玩家正在思考……", speakingNow: "{name}正在发言……",
    claims: "报{role}", ghost: "还有死人票", alive: "存活 {a}/{n}", youTag: "（你）",
    onlyYouTag: "仅你可见：", privateTag: "私聊：", pickHint: "点击桌上高亮的玩家，或在下面选择。",
    pass: "跳过", yes: "是，举手", no: "不", confirm: "确认", useDefault: "使用 {names}",
    chosen: "已选：{names}。", none: "还没有", pickN: "在桌上点击{k}名玩家。",
    good: "善良", evil: "邪恶", yourChar: "你的角色", claimedBy: "{names}报了这个",
    over: "{team}获胜。", overNoOne: "游戏达到天数上限。", overHint: "桌上现在显示了每个人的真实角色。“故事”里有完整的魔典和说书人笔记。",
    playAgain: "再来一局", close: "关闭", history: "他说过和做过的事", nothing: "还没有。",
    dead: "已死亡", phases: { setup: "准备中", night: "夜晚", dawn: "黎明", introductions: "自我介绍", "private chats": "私聊", discussion: "公开讨论", nominations: "提名", over: "游戏结束" },
    dayN: "第{n}天", nightN: "第{n}夜", wrong: "出错了：",
    kinds: { townsfolk: "镇民", outsider: "外来者", minion: "爪牙", demon: "恶魔" },
    loading: "正在加载游戏引擎（首次约12 MB）……",
    engineFailed: "游戏引擎无法在这个浏览器中启动。",
  },
};
const $ = id => document.getElementById(id);

// Talk to the game: the local Python server, or (standalone build) Python running in a Web Worker.
const STANDALONE = window.CT_STANDALONE || null;
let worker = null, nextId = 0;
const waiting = new Map();
if (STANDALONE) {
  worker = new Worker("worker.js?pyodide=" + encodeURIComponent(STANDALONE.pyodide));
  worker.onmessage = e => { const w = waiting.get(e.data.id); if (w) { waiting.delete(e.data.id); w(e.data); } };
  worker.onerror = e => { $("loading").hidden = false; $("loading").querySelector(".card").textContent = T("engineFailed") + " " + (e.message || ""); };
}
async function api(path, body) {
  if (!worker) {
    const r = await fetch(path, body === undefined ? undefined : { method: "POST", body: JSON.stringify(body) });
    return { ok: r.ok, data: await r.json() };
  }
  const [p, qs] = path.split("?");
  const query = Object.fromEntries(new URLSearchParams(qs || ""));
  const res = await new Promise(resolve => { const id = ++nextId; waiting.set(id, resolve); worker.postMessage({ id, path: p, query, body }); });
  return { ok: res.status < 400, data: res.data };
}
let lang = "en", since = 0, game = null, promptId = null, picked = [], view = "start", roles = [], rolesNote = "";
let lastPhase = null, bubbles = {};
try { lang = localStorage.getItem("ct-lang") || (navigator.language || "").startsWith("zh") && "zh" || "en"; } catch (e) {}
const T = (k, vars = {}) => String(UI[lang][k] ?? UI.en[k] ?? k).replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? "");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = T(el.dataset.i));
  document.querySelectorAll("#langSeg button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  $("name").placeholder = lang === "zh" ? "例如：小明" : "e.g. Max";
  $("seedIn").placeholder = T("random");
  fillPlayers(); fillSeats();
}
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = async () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("ct-lang", lang); } catch (e) {}
  applyLang(); await loadRoles();
  since = 0; $("pane-story").innerHTML = ""; $("pane-mine").innerHTML = ""; promptId = null;
});

async function loadRoles() {
  const r = (await api("/api/roles?lang=" + lang)).data;
  if (r.engine) { $("loading").hidden = false; $("loading").querySelector(".card").textContent = T("engineFailed") + " " + r.error; throw new Error(r.error); }
  roles = r.roles; rolesNote = r.note;
  drawChars();
}

// ---- start screen -------------------------------------------------------------------------
function fillPlayers() {
  const sel = $("players"), cur = +sel.value || 8; sel.innerHTML = "";
  for (let n = 5; n <= 15; n++) sel.add(new Option(T("playersN", { n }) + (n === 8 ? T("recommended") : n > 10 ? T("slowN") : ""), n, false, n === cur));
}
function fillSeats() {
  const n = +$("players").value || 8, s = $("seat"), cur = s.value; s.innerHTML = "";
  s.add(new Option(T("random"), ""));
  for (let i = 0; i < n; i++) s.add(new Option(T("seatN", { n: i + 1 }), i));
  s.value = cur && +cur < n ? cur : "";
}
$("players").onchange = fillSeats;
try { $("name").value = localStorage.getItem("ct-name") || ""; } catch (e) {}

function show(v) {
  view = v;
  $("start").hidden = v !== "start"; $("game").hidden = v !== "game";
  $("newBtn").hidden = v !== "game"; $("speedBox").hidden = v !== "game";
  $("backBtn").hidden = !(v === "start" && game);
}
$("startBtn").onclick = async () => {
  const name = $("name").value.trim();
  try { localStorage.setItem("ct-name", name); } catch (e) {}
  const r = await api("/api/new", {
    name, players: +$("players").value, seat: $("seat").value, seed: $("seedIn").value.trim(), hints: $("hints").checked, lang,
    side: $("side").value });
  if (!r.ok) { $("startErr").textContent = r.data.error; return; }
  since = 0; promptId = null; picked = []; game = null; lastPhase = null; bubbles = {};
  $("pane-story").innerHTML = ""; $("pane-mine").innerHTML = ""; $("prompt").innerHTML = "";
  show("game");
};
$("newBtn").onclick = () => show("start");
$("backBtn").onclick = () => show("game");
$("speed").onchange = () => api("/api/speed", { speed: $("speed").value });

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["story", "notes", "mine", "chars"].forEach(t => $("pane-" + t).hidden = t !== b.dataset.tab);
});

// ---- polling --------------------------------------------------------------------------------
async function poll() {
  try {
    render((await api(`/api/state?since=${since}&lang=${lang}`)).data.game);
  } catch (e) { /* server restarting */ }
  setTimeout(poll, 300);
}

function render(g) {
  if (!g || view !== "game") return;
  game = g;
  const you = $("you"); you.hidden = false;
  you.textContent = T("you", { name: g.seats[g.you].name, role: g.role });
  you.className = "chip " + (g.evil ? "evil" : "good");
  $("seed").hidden = false; $("seed").textContent = T("game", { n: g.seed });
  if (document.activeElement !== $("speed")) $("speed").value = g.speed;
  const rc = $("roleCard");
  rc.className = "card" + (g.evil ? " evil" : "");
  rc.innerHTML = `<div><span class="rname">${esc(g.role)}</span><span class="rkind">${esc(g.kind_name)} · ${esc(g.evil ? T("evil") : T("good"))}</span></div><div class="rtext">${esc(g.ability)}</div>`;
  document.body.classList.toggle("night", g.phase === "night");
  lastPhase = g.phase;

  for (const e of g.log) addLine(e, g);
  if (g.log.length) { since = g.log_len; const p = $("pane-story"); p.scrollTop = p.scrollHeight; }
  $("notes").textContent = g.notebook.join("\n");
  drawTable(g);
  drawPrompt(g);
  drawChars();
}

function phaseBanner(g) {
  let text = null;
  if (g.phase === "night") text = T("nightN", { n: g.night });
  else if (g.phase === "dawn") text = T("dayN", { n: g.day });
  else if (g.phase === "over") text = (UI[lang].phases || UI.en.phases).over;
  if (!text) return;
  const b = $("banner"); b.firstElementChild.textContent = text;
  b.classList.add("show"); setTimeout(() => b.classList.remove("show"), 1600);
}

function addLine(e, g) {
  const t = e.text.replace(/^\n+/, "");
  if (!t) return;
  const d = document.createElement("div");
  d.className = "line";
  const name = e.speaker !== null && e.speaker !== undefined ? g.seats[e.speaker].name : null;
  if (e.chat || e.private) {
    d.classList.add(e.chat ? "chat" : "private");
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = T(e.chat ? "privateTag" : "onlyYouTag");
    d.append(tag);
    if (e.quote !== null && name) { const b = document.createElement("b"); b.textContent = name + (lang === "zh" ? "：" : ": "); d.append(b, e.quote); }
    else d.append(t);
  } else if (e.key === "day_header") { d.classList.add("day"); d.textContent = t; }
  else if (/^(night_falls|dawn_|phase_|vote_on|chats_step|game_start)/.test(e.key)) { d.classList.add("sys"); d.textContent = t; }
  else if (e.quote !== null && name) {
    d.classList.add("say");
    const tagName = (UI[lang].tags || UI.en.tags)[e.sub];
    if (tagName) { const tg = document.createElement("span"); tg.className = "tag2 " + (e.sub || "").replace(/_.*/, ""); tg.textContent = tagName; d.append(tg); }
    if (e.sub === "report") d.classList.add("info-line");
    const b = document.createElement("b"); b.textContent = name + (lang === "zh" ? "：" : ": "); d.append(b, e.quote);
  }
  else { if (/^(votes_|executed|winner|virgin|shoot|was_saint|mayor_win|no_execution)/.test(e.key)) d.classList.add("result"); d.textContent = t; }
  $("pane-story").append(d);
  if (e.private) $("pane-mine").append(d.cloneNode(true));
  if (name && (e.quote || e.key === "shoot" || e.key.startsWith("nominates"))) {
    bubbles = { [e.speaker]: { text: e.quote || t, chat: e.chat, until: Infinity, born: Date.now() } };  // stays until the next line
  }
  if (/^(nominates|votes_|executed|no_execution|virgin|shoot|vote_on|dawn_|claim_change)/.test(e.key) || e.sub === "claim_change") {
    $("ticker").hidden = false; $("ticker").textContent = t;
  }
  if (e.key === "night_falls") { $("ticker").hidden = true; }
}

// ---- table ----------------------------------------------------------------------------------
function seatPos(i, n, r = 38) {
  const a = -Math.PI / 2 + 2 * Math.PI * i / n;
  return { x: 50 + r * Math.cos(a), y: 49 + (r - 1) * Math.sin(a), a };
}
function abilityOf(key) { const r = roles.find(x => x.role === key); return r ? `${r.name}: ${r.ability}` : ""; }

function drawTable(g) {
  const tbl = $("table");
  tbl.querySelectorAll(".seat, .bubble").forEach(x => x.remove());
  const p = g.prompt, pickable = p && (p.type === "seat" || p.type === "seats") ? new Set(p.seats) : new Set();
  const now = Date.now();
  g.seats.forEach((s, i) => {
    const pos = seatPos(i, g.players);
    const el = document.createElement("div");
    el.className = "seat" + (s.you ? " you" : "") + (!s.alive ? " dead" : "") + (g.evil && s.evil && !s.you && !g.over ? " mate" : "")
      + (pickable.has(i) ? " pickable" : "") + (picked.includes(i) ? " picked" : "") + (g.speaking === i ? " speaking" : "");
    el.style.left = pos.x + "%"; el.style.top = pos.y + "%";
    el.innerHTML = `<div class="token">${esc([...s.name].slice(0, 2).join(""))}</div>
      <div class="name">${esc(s.name)}${s.you ? esc(T("youTag")) : ""}</div>
      ${s.ghost && !g.over ? `<div class="ghost">${esc(T("ghost"))}</div>` : ""}
      <div class="claim" title="${esc(abilityOf(s.claim_key))}">${s.claim ? esc(T("claims", { role: s.claim })) : "&nbsp;"}</div>
      ${s.role ? `<div class="role ${s.evil ? "evil" : "good"}" title="${esc(abilityOf(s.role_key))}">${esc(s.role)}</div>` : ""}`;
    el.onclick = () => pickable.has(i) ? pickSeat(i) : playerCard(i);
    tbl.append(el);
    const b = bubbles[i];
    if (b && b.until > now) {
      const bp = seatPos(i, g.players, 22);
      const bub = document.createElement("div");
      bub.className = "bubble" + (b.chat ? " chat" : "") + (now - b.born < 400 ? " new" : "");
      bub.textContent = b.text;
      bub.style.left = `calc(${bp.x}% - 115px)`; bub.style.top = `calc(${bp.y}% - 22px)`;
      tbl.append(bub);
    }
  });
  const ph = (UI[lang].phases || UI.en.phases)[g.phase] || g.phase;
  const when = g.phase === "night" ? T("nightN", { n: g.night }) : g.day ? T("dayN", { n: g.day }) : "";
  const alive = g.seats.filter(s => s.alive).length;
  $("center").innerHTML = `<div class="big">${esc(when)}</div><div>${esc(ph)}</div><div class="small">${esc(T("alive", { a: alive, n: g.players }))}</div>`;
}

function playerCard(i) {
  const s = game.seats[i], m = $("modal");
  m.innerHTML = `<div class="card"><h3>${esc(s.name)}${s.you ? esc(T("youTag")) : ""}${s.alive ? "" : " · " + esc(T("dead"))}</h3>
    ${s.claim ? `<div class="hint">${esc(T("claims", { role: s.claim }))}</div><p style="margin:4px 0 10px">${esc(abilityOf(s.claim_key))}</p>` : ""}
    ${s.role ? `<div class="role ${s.evil ? "evil" : "good"}" style="font-weight:700">${esc(s.role)}</div>` : ""}
    <h4>${esc(T("history"))}</h4>
    <pre>${esc(s.history.length ? s.history.map(x => x.trim()).join("\n") : T("nothing"))}</pre>
    <div style="margin-top:12px"><button id="closeModal">${esc(T("close"))}</button></div></div>`;
  m.hidden = false;
  m.onclick = e => { if (e.target === m) m.hidden = true; };
  $("closeModal").onclick = () => m.hidden = true;
}

function pickSeat(i) {
  const p = game.prompt;
  if (p.type === "seat") return answer(i);
  picked = picked.includes(i) ? picked.filter(x => x !== i) : [...picked, i].slice(-p.k);
  drawTable(game); drawPrompt(game, true);
}

// ---- characters reference -------------------------------------------------------------------
function drawChars() {
  const pane = $("pane-chars");
  if (!roles.length) return;
  const claimedBy = {};
  if (game) game.seats.forEach(s => { if (s.claim_key) (claimedBy[s.claim_key] ||= []).push(s.name); });
  let html = "";
  for (const kind of ["townsfolk", "outsider", "minion", "demon"]) {
    html += `<h4>${esc((UI[lang].kinds || UI.en.kinds)[kind])}</h4>`;
    for (const r of roles.filter(x => x.kind === kind)) {
      const mine = game && game.role_key === r.role;
      const who = claimedBy[r.role] ? `<span class="who">${esc(T("claimedBy", { names: claimedBy[r.role].join(lang === "zh" ? "、" : ", ") }))}</span>` : "";
      html += `<div class="role-ref${mine ? " mine" : ""}"><span class="n">${esc(r.name)}</span>${mine ? `<span class="k">${esc(T("yourChar"))}</span>` : ""}${who}<p>${esc(r.ability)}</p></div>`;
    }
  }
  html += `<p class="hint" style="color:var(--muted)">${esc(rolesNote)}</p>`;
  if (pane.dataset.html !== html) { pane.innerHTML = html; pane.dataset.html = html; }
}

// ---- prompt ---------------------------------------------------------------------------------
function drawPrompt(g, force) {
  const box = $("prompt"), p = g.prompt;
  if (g.error) { box.innerHTML = `<div class="err">${esc(T("wrong"))}\n${esc(g.error)}</div>`; return; }
  if (g.over) {
    if (promptId !== "over") {
      promptId = "over";
      const team = g.winner === "good" ? T("good") : g.winner === "evil" ? T("evil") : null;
      box.innerHTML = `<div class="banner-end">${esc(team ? T("over", { team }) : T("overNoOne"))}</div>
        <div class="hint">${esc(T("overHint"))}</div><button class="primary" id="again">${esc(T("playAgain"))}</button>`;
      $("again").onclick = () => show("start");
    }
    return;
  }
  if (!p || p.type !== "ack") { if (!$("card").hidden && !(p && p.type === "ack")) $("card").hidden = true; }
  if (!p) {
    promptId = null; picked = [];
    const who = g.speaking !== null && g.speaking !== undefined ? T("speakingNow", { name: g.seats[g.speaking].name }) : T("thinking");
    const html = `<div class="waiting"><span class="dots"><span></span><span></span><span></span></span>${esc(who)}</div>`;
    if (box.dataset.wait !== html) { box.innerHTML = html; box.dataset.wait = html; }
    return;
  }
  box.dataset.wait = "";
  if (p.type === "ack") { showCard(p, g); return; }
  const key = p.id + lang;
  if (key === promptId && !force) return;
  if (key !== promptId) { picked = []; promptId = key; drawTable(g); }
  const name = s => g.seats[s].name;
  let html = `<div class="q">${esc(p.text)}</div>`;
  if (p.type === "next") {
    html = `<div class="opts"><button class="primary" data-next="1">${esc(T("nextLine"))}</button></div>`;
  } else if (p.type === "choose") {
    html += `<div class="opts">${p.labels.map((l, i) => `<button class="${i === p.default ? "primary" : ""}" data-v="${i}">${esc(l)}</button>`).join("")}</div>`;
  } else if (p.type === "yesno") {
    html += `<div class="opts"><button class="primary" data-yes="1">${esc(T("yes"))}</button><button data-yes="0">${esc(T("no"))}</button></div>`;
  } else if (p.type === "seat") {
    html += `<div class="hint">${esc(T("pickHint"))}</div><div class="opts">`
      + p.seats.map(s => `<button data-v="${s}" class="${s === p.default ? "primary" : ""}">${esc(name(s))}</button>`).join("")
      + (p.default === null ? `<button class="primary" data-pass="1">${esc(T("pass"))}</button>` : "") + `</div>`;
  } else if (p.type === "seats") {
    const sep = lang === "zh" ? "、" : ", ";
    html += `<div class="hint">${esc(T("pickN", { k: p.k }))} ${esc(T("chosen", { names: picked.map(name).join(sep) || T("none") }))}</div>
      <div class="opts"><button class="primary" id="confirm" ${picked.length === p.k ? "" : "disabled"}>${esc(T("confirm"))}</button>
      <button id="dflt">${esc(T("useDefault", { names: p.default.map(name).join(" & ") }))}</button></div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll("[data-v]").forEach(b => b.onclick = () => answer(+b.dataset.v));
  box.querySelectorAll("[data-yes]").forEach(b => b.onclick = () => answer(b.dataset.yes === "1"));
  box.querySelectorAll("[data-pass]").forEach(b => b.onclick = () => answer(null));
  box.querySelectorAll("[data-next]").forEach(b => b.onclick = () => answer(true));
  if ($("confirm")) $("confirm").onclick = () => answer(picked);
  if ($("dflt")) $("dflt").onclick = () => answer(p.default);
}

// An event card: stays up a few seconds (longer when slower), or until "Continue".
let cardFor = null, cardTimer = null;
const CARD_SECONDS = { slow: 8, normal: 5.5, fast: 3, step: 0 };
function showCard(p, g) {
  if (cardFor === p.id + lang) return;
  cardFor = p.id + lang;
  const card = $("card");
  card.classList.toggle("night", g.phase === "night");
  $("cardTitle").textContent = p.title || "";
  $("cardText").textContent = p.text || "";
  $("cardText").hidden = !p.text;
  $("cardBtn").textContent = T("cont");
  card.hidden = false;
  clearTimeout(cardTimer);
  const secs = CARD_SECONDS[g.speed] ?? 5.5, bar = $("cardBar");
  bar.style.transition = "none"; bar.style.transform = "scaleX(1)";
  bar.parentElement.hidden = !secs;
  if (secs) {
    requestAnimationFrame(() => { bar.style.transition = `transform ${secs}s linear`; bar.style.transform = "scaleX(0)"; });
    cardTimer = setTimeout(closeCard, secs * 1000);
  }
  $("cardBtn").onclick = closeCard;
  $("cardBtn").focus();
}
function closeCard() {
  clearTimeout(cardTimer);
  $("card").hidden = true;
  if (game && game.prompt && game.prompt.type === "ack") answer(true);
}

async function answer(value) {
  const p = game.prompt;
  const r = await api("/api/answer", { id: p.id, value });
  if (!r.ok) { $("prompt").insertAdjacentHTML("beforeend", `<div class="err">${esc(r.data.error)}</div>`); return; }
  picked = []; game.prompt = null; drawTable(game); drawPrompt(game);
}

(async () => {
  applyLang();
  if (STANDALONE) $("loading").hidden = false;
  await loadRoles();  // in the standalone build this waits for Python to start
  $("loading").hidden = true;
  game = (await api(`/api/state?since=0&lang=${lang}`)).data.game;
  show(game ? "game" : "start");
  poll();
  setInterval(() => { if (game && view === "game") drawTable(game); }, 1000);  // let speech bubbles expire
})();
</script>
</body>
</html>
