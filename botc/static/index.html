<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clocktower Solo</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #fffdf8; --ink: #22201c; --muted: #6b665c; --line: #ddd6c8;
    --accent: #7a2331; --accent-ink: #fff; --gold: #b8860b; --good: #2f5d8a; --evil: #a3202f;
    --you: #b8860b; --sel: #2f7d4f; --private-bg: #fbf3d9; --dead: #9a958b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c; --panel: #1d2028; --ink: #e8e4da; --muted: #a29d92; --line: #343846;
      --accent: #c2485b; --accent-ink: #fff; --gold: #d9a632; --good: #6ea3d8; --evil: #e06272;
      --you: #d9a632; --sel: #4fb47a; --private-bg: #2f2a1c; --dead: #6c6a66;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0 12px 0 0; letter-spacing: .3px; }
  .chip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
  .chip.good { border-color: var(--good); color: var(--good); }
  .chip.evil { border-color: var(--evil); color: var(--evil); }
  .spacer { flex: 1; }
  button { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }

  /* table */
  #table { position: relative; width: 100%; max-width: 620px; aspect-ratio: 1; margin: 0 auto; }
  #center { position: absolute; inset: 32%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 50%; border: 1px dashed var(--line); }
  #center .big { font-size: 22px; font-weight: 650; }
  #center .small { color: var(--muted); font-size: 13px; }
  .seat { position: absolute; width: 96px; margin: -40px 0 0 -48px; text-align: center; user-select: none; }
  .token { width: 58px; height: 58px; margin: 0 auto 3px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); display: flex; align-items: center; justify-content: center; font-weight: 650; font-size: 15px; position: relative; transition: transform .12s, box-shadow .12s; }
  .seat.you .token { border-color: var(--you); box-shadow: 0 0 0 3px color-mix(in srgb, var(--you) 30%, transparent); }
  .seat.mate .token { border-color: var(--evil); }
  .seat.dead .token { background: transparent; color: var(--dead); border-style: dashed; }
  .seat.dead .name { color: var(--dead); text-decoration: line-through; }
  .seat .ghost { font-size: 11px; color: var(--muted); font-style: italic; }
  .seat .name { font-size: 13px; font-weight: 600; }
  .seat .claim { font-size: 12px; color: var(--muted); line-height: 1.2; }
  .seat .role { font-size: 11px; font-weight: 600; }
  .seat .role.good { color: var(--good); } .seat .role.evil { color: var(--evil); }
  .seat.pickable { cursor: pointer; }
  .seat.pickable .token { border-color: var(--sel); animation: pulse 1.4s infinite; }
  .seat.picked .token { background: var(--sel); color: #fff; border-color: var(--sel); animation: none; }
  .seat.pickable:hover .token { transform: scale(1.08); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--sel) 25%, transparent); } }

  /* prompt */
  #prompt { margin-top: 14px; min-height: 92px; }
  #prompt .q { font-weight: 600; margin-bottom: 10px; }
  #prompt .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  #prompt .hint { color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
  .waiting { color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .banner { font-size: 20px; font-weight: 700; margin-bottom: 8px; }

  /* side */
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  #side .pane { height: calc(100vh - 170px); min-height: 360px; overflow-y: auto; padding-right: 6px; }
  @media (max-width: 900px) { #side .pane { height: 60vh; } }
  .line { padding: 3px 0; }
  .line.day { margin-top: 14px; font-weight: 700; font-size: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
  .line.sys { color: var(--muted); font-style: italic; }
  .line.say b { margin-right: 4px; }
  .line.private { background: var(--private-bg); border-left: 3px solid var(--gold); padding: 5px 8px; margin: 4px 0; border-radius: 4px; }
  .line.private::before { content: "Only you: "; font-weight: 600; color: var(--gold); }
  .line.chat { background: color-mix(in srgb, var(--good) 10%, transparent); border-left: 3px solid var(--good); padding: 5px 8px; margin: 4px 0; border-radius: 4px; }
  .line.chat::before { content: "In private: "; font-weight: 600; color: var(--good); }
  .line.result { font-weight: 600; }
  pre { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 0; }

  /* start */
  #start { max-width: 560px; margin: 40px auto; }
  #start label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 14px; }
  #start input, #start select { font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  #start .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #start .check { display: flex; gap: 8px; align-items: center; margin-top: 14px; font-weight: 400; }
  #start .check input { width: auto; }
  #start p { color: var(--muted); font-size: 14px; }
  .err { color: var(--evil); font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Clocktower Solo</h1>
  <span id="you" class="chip" hidden></span>
  <span id="seed" class="chip" hidden></span>
  <span class="spacer"></span>
  <button id="newBtn" hidden>New game</button>
</header>

<section id="start" class="card" hidden>
  <h2 style="margin-top:0">Trouble Brewing, solo</h2>
  <p>You take one seat; everyone else at the table is an AI player. Each day, everyone speaks in
     turn, then nominations and votes. Good players may bluff too, but changing your claim costs trust.
     Everything said is kept in your notebook.</p>
  <label for="name">Your name</label>
  <input id="name" maxlength="20" placeholder="e.g. Max" autocomplete="off">
  <div class="row">
    <div><label for="players">Players</label>
      <select id="players"></select></div>
    <div><label for="seat">Your seat</label>
      <select id="seat"></select></div>
  </div>
  <label for="seedIn">Game number (optional, to replay)</label>
  <input id="seedIn" inputmode="numeric" placeholder="random">
  <label class="check"><input type="checkbox" id="hints"> Show me hints (a veteran's read of the suspects)</label>
  <div style="margin-top:18px;display:flex;gap:8px"><button class="primary" id="startBtn">Take your seat</button>
    <button id="backBtn" hidden>Back to the current game</button></div>
  <div class="err" id="startErr"></div>
</section>

<main id="game" hidden>
  <div>
    <div id="table" class="card" style="border-radius:50%;padding:0"><div id="center"></div></div>
    <div id="prompt" class="card"></div>
  </div>
  <div id="side" class="card">
    <div class="tabs">
      <button data-tab="story" class="on">Story</button>
      <button data-tab="notes">Notebook</button>
      <button data-tab="mine">Only you</button>
    </div>
    <div class="pane" id="pane-story"></div>
    <div class="pane" id="pane-notes" hidden><pre id="notes"></pre></div>
    <div class="pane" id="pane-mine" hidden></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let since = 0, game = null, promptId = null, picked = [], view = "start";
function show(v) {
  view = v;
  $("start").hidden = v !== "start"; $("game").hidden = v !== "game";
  $("newBtn").hidden = v !== "game"; $("backBtn").hidden = !(v === "start" && game);
}

// ---- start screen -------------------------------------------------------------------------
for (let n = 5; n <= 15; n++) $("players").add(new Option(`${n} players${n === 8 ? " (recommended)" : n > 10 ? " (slow)" : ""}`, n, n === 8, n === 8));
function fillSeats() {
  const n = +$("players").value, s = $("seat"); s.innerHTML = "";
  s.add(new Option("Random", ""));
  for (let i = 0; i < n; i++) s.add(new Option(`Seat ${i + 1}`, i));
}
$("players").onchange = fillSeats; fillSeats();
try { $("name").value = localStorage.getItem("ct-name") || ""; } catch (e) {}

$("startBtn").onclick = async () => {
  const name = $("name").value.trim();
  try { localStorage.setItem("ct-name", name); } catch (e) {}
  const r = await fetch("/api/new", { method: "POST", body: JSON.stringify({
    name, players: +$("players").value, seat: $("seat").value, seed: $("seedIn").value.trim(), hints: $("hints").checked }) });
  if (!r.ok) { $("startErr").textContent = (await r.json()).error; return; }
  since = 0; promptId = null; picked = []; game = null;
  $("pane-story").innerHTML = ""; $("pane-mine").innerHTML = ""; $("prompt").innerHTML = "";
  show("game");
};
$("newBtn").onclick = () => show("start");
$("backBtn").onclick = () => show("game");

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  ["story", "notes", "mine"].forEach(t => $("pane-" + t).hidden = t !== b.dataset.tab);
});

// ---- polling --------------------------------------------------------------------------------
async function poll() {
  try {
    const r = await fetch("/api/state?since=" + since);
    render((await r.json()).game);
  } catch (e) { /* server restarting */ }
  setTimeout(poll, 400);
}

function render(g) {
  if (!g || view !== "game") return;
  game = g;
  const you = $("you"); you.hidden = false;
  you.textContent = `You: ${g.seats[g.you].name}, the ${g.role}`;
  you.className = "chip " + (g.evil ? "evil" : "good");
  $("seed").hidden = false; $("seed").textContent = `Game #${g.seed}`;

  for (const e of g.log) addLine(e);
  if (g.log.length) { since = g.log_len; const p = $("pane-story"); p.scrollTop = p.scrollHeight; }
  $("notes").textContent = g.notebook.join("\n");
  drawTable(g);
  drawPrompt(g);
}

function addLine(e) {
  const t = e.text.replace(/^\n+/, "");
  if (!t) return;
  const d = document.createElement("div");
  d.className = "line";
  const speech = t.match(/^([^:"]{1,48}): (".*)$/);
  if (e.chat) {
    d.classList.add("chat");
    if (speech) { const b = document.createElement("b"); b.textContent = speech[1] + ":"; d.append(b, " " + speech[2]); }
    else d.append(t);
  }
  else if (e.private) { d.classList.add("private"); d.textContent = t; }
  else if (t.startsWith("===")) { d.classList.add("day"); d.textContent = t.replace(/=/g, "").trim(); }
  else if (/^(Dawn|Introductions|Private conversations|Discussion|Nominations are open|Vote on)/.test(t) || / step aside to talk privately\.$/.test(t)) { d.classList.add("sys"); d.textContent = t; }
  else if (speech) { d.classList.add("say"); const b = document.createElement("b"); b.textContent = speech[1] + ":"; d.append(b, " " + speech[2]); }
  else { if (/vote\(s\)|executed|WINS|dies/.test(t)) d.classList.add("result"); d.textContent = t; }
  $("pane-story").append(d);
  if (e.private) { const m = d.cloneNode(true); $("pane-mine").append(m); }
}

// ---- table ----------------------------------------------------------------------------------
function drawTable(g) {
  const tbl = $("table");
  tbl.querySelectorAll(".seat").forEach(x => x.remove());
  const p = g.prompt, pickable = p && (p.type === "seat" || p.type === "seats") ? new Set(p.seats) : new Set();
  g.seats.forEach((s, i) => {
    const a = -Math.PI / 2 + 2 * Math.PI * i / g.players;
    const el = document.createElement("div");
    el.className = "seat" + (s.you ? " you" : "") + (!s.alive ? " dead" : "") + (g.evil && s.evil && !s.you && !g.over ? " mate" : "")
      + (pickable.has(i) ? " pickable" : "") + (picked.includes(i) ? " picked" : "");
    el.style.left = (50 + 38 * Math.cos(a)) + "%"; el.style.top = (49 + 37 * Math.sin(a)) + "%";
    const initials = s.name.slice(0, 2);
    el.innerHTML = `<div class="token">${esc(initials)}</div>
      <div class="name">${esc(s.name)}${s.you ? " (you)" : ""}</div>
      ${s.ghost && !g.over ? '<div class="ghost" title="Dead players get one vote for the rest of the game">ghost vote left</div>' : ""}
      <div class="claim">${s.claim ? "claims " + esc(s.claim) : "&nbsp;"}</div>
      ${s.role ? `<div class="role ${s.evil ? "evil" : "good"}">${esc(s.role)}</div>` : ""}`;
    if (pickable.has(i)) el.onclick = () => pickSeat(i);
    tbl.append(el);
  });
  const phase = { setup: "Setting up", night: "Night", dawn: "Dawn", introductions: "Introductions", "private chats": "Private chats", discussion: "Discussion", nominations: "Nominations", over: "Game over" }[g.phase] || g.phase;
  const when = g.phase === "night" ? `Night ${g.night}` : g.day ? `Day ${g.day}` : "";
  const alive = g.seats.filter(s => s.alive).length;
  $("center").innerHTML = `<div class="big">${esc(when)}</div><div>${esc(phase)}</div><div class="small">${alive} of ${g.players} alive</div>`;
}

function pickSeat(i) {
  const p = game.prompt;
  if (p.type === "seat") return answer(i);
  picked = picked.includes(i) ? picked.filter(x => x !== i) : [...picked, i].slice(-p.k);
  drawTable(game); drawPrompt(game, true);
}

// ---- prompt ---------------------------------------------------------------------------------
function drawPrompt(g, force) {
  const box = $("prompt"), p = g.prompt;
  if (g.error) { box.innerHTML = `<div class="err">Something went wrong:\n${esc(g.error)}</div>`; return; }
  if (g.over) {
    if (promptId !== "over") {
      promptId = "over";
      box.innerHTML = `<div class="banner">${g.winner ? esc(g.winner[0].toUpperCase() + g.winner.slice(1)) + " wins." : "The game ran out of days."}</div>
        <div class="hint">Everyone's true character is now shown at the table. The Story tab has the full Grimoire and the Storyteller's notes.</div>
        <button class="primary" onclick="document.getElementById('newBtn').click()">Play again</button>`;
    }
    return;
  }
  if (!p) {
    if (promptId !== null) { promptId = null; picked = []; }
    box.innerHTML = `<div class="waiting"><span class="dot"></span>The others are thinking…</div>`;
    return;
  }
  if (p.id === promptId && !force) return;
  if (p.id !== promptId) { picked = []; promptId = p.id; drawTable(g); }
  const name = s => g.seats[s].name;
  let html = `<div class="q">${esc(p.text)}</div>`;
  if (p.type === "choose") {
    html += `<div class="opts">${p.labels.map((l, i) => `<button class="${i === p.default ? "primary" : ""}" data-v="${i}">${esc(l)}</button>`).join("")}</div>`;
  } else if (p.type === "yesno") {
    html += `<div class="opts"><button class="primary" data-yes="1">Yes, raise my hand</button><button data-yes="0">No</button></div>`;
  } else if (p.type === "seat") {
    html += `<div class="hint">Click a highlighted player at the table, or choose below.</div><div class="opts">`
      + p.seats.map(s => `<button data-v="${s}">${esc(name(s))}</button>`).join("")
      + (p.default === null ? `<button class="primary" data-pass="1">Pass</button>` : "") + `</div>`;
  } else if (p.type === "seats") {
    html += `<div class="hint">Click ${p.k} players at the table. Chosen: ${picked.map(name).map(esc).join(", ") || "none yet"}.</div>
      <div class="opts"><button class="primary" id="confirm" ${picked.length === p.k ? "" : "disabled"}>Confirm</button>
      <button id="dflt">Use ${p.default.map(name).map(esc).join(" & ")}</button></div>`;
  }
  box.innerHTML = html;
  box.querySelectorAll("[data-v]").forEach(b => b.onclick = () => answer(+b.dataset.v));
  box.querySelectorAll("[data-yes]").forEach(b => b.onclick = () => answer(b.dataset.yes === "1"));
  box.querySelectorAll("[data-pass]").forEach(b => b.onclick = () => answer(null));
  if ($("confirm")) $("confirm").onclick = () => answer(picked);
  if ($("dflt")) $("dflt").onclick = () => answer(p.default);
}

async function answer(value) {
  const p = game.prompt;
  const r = await fetch("/api/answer", { method: "POST", body: JSON.stringify({ id: p.id, value }) });
  if (!r.ok) { const e = await r.json(); $("prompt").insertAdjacentHTML("beforeend", `<div class="err">${esc(e.error)}</div>`); return; }
  picked = []; game.prompt = null; drawTable(game); drawPrompt(game);
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }

(async () => {
  const r = await fetch("/api/state?since=0");
  game = (await r.json()).game;
  show(game ? "game" : "start");
  poll();
})();
</script>
</body>
</html>
