# Builds the standalone web game (Python running in the browser) and publishes it with GitHub Pages.
# Enable once: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tests/test_core.py
      - name: Bundle Pyodide, so playing needs no CDN
        run: curl -sL https://registry.npmjs.org/pyodide/-/pyodide-0.29.5.tgz | tar xz
      - run: python build_web.py --out dist --pyodide package
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
